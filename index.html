<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <title>Lumim</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #101010;
      --surface-light: #181818;
      --line: rgba(255,255,255,.12);
      --muted: #9b9b9b;
      --white: #fff;
      --radius: 18px;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 85% 0%, rgba(255,255,255,.07), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    img {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       INTRODUÇÃO
    ========================================================= */

    .splash {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.04), transparent 34%),
        #050505;
      transition:
        opacity .8s var(--ease),
        visibility .8s;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .leaf-intro {
      position: relative;
      z-index: 5;
      width: clamp(170px, 25vw, 290px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      animation: leafEntrance 1.7s var(--ease) both;
    }

    .intro-leaf {
      position: relative;
      z-index: 4;
      width: 76%;
      height: 76%;
      object-fit: contain;
      mix-blend-mode: screen;
      filter:
        grayscale(1)
        brightness(1.9)
        contrast(1.3)
        drop-shadow(0 0 12px rgba(255,255,255,.2))
        drop-shadow(0 0 32px rgba(255,255,255,.13));
      animation:
        leafFloat 4.8s ease-in-out infinite,
        leafPulse 3.6s ease-in-out infinite;
    }

    .leaf-glow {
      position: absolute;
      z-index: 1;
      width: 73%;
      height: 73%;
      border-radius: 50%;
      background: rgba(255,255,255,.11);
      filter: blur(42px);
      animation: glowPulse 3.5s ease-in-out infinite;
    }

    @keyframes leafEntrance {
      0% {
        opacity: 0;
        transform: scale(.25) rotate(-18deg);
        filter: blur(18px);
      }

      55% {
        opacity: 1;
        transform: scale(1.08) rotate(4deg);
        filter: blur(0);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes leafFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(0, -7px, 0) rotate(2deg);
      }
    }

    @keyframes leafPulse {
      0%, 100% {
        filter:
          grayscale(1)
          brightness(1.8)
          contrast(1.25)
          drop-shadow(0 0 12px rgba(255,255,255,.18))
          drop-shadow(0 0 30px rgba(255,255,255,.1));
      }

      50% {
        filter:
          grayscale(1)
          brightness(2.2)
          contrast(1.4)
          drop-shadow(0 0 18px rgba(255,255,255,.35))
          drop-shadow(0 0 48px rgba(255,255,255,.17));
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: .35;
        transform: scale(.85);
      }

      50% {
        opacity: .75;
        transform: scale(1.12);
      }
    }

    .ascii-orbit {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(78vw, 720px);
      height: min(78vw, 720px);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      font-family: "Courier New", monospace;
      font-size: clamp(11px, 1.2vw, 16px);
      line-height: 1;
      letter-spacing: .18em;
      color: rgba(255,255,255,.6);
      white-space: pre;
      text-shadow: 0 0 9px rgba(255,255,255,.55);
      animation:
        asciiAppear 1.2s .45s ease-out forwards,
        orbitDrift 15s linear infinite;
    }

    .ascii-orbit::before {
      content:
"                 .       .       .
          .  .       /\\       .  .
       .       .    /  \\    .       .
          .        / /\\ \\        .
   .       .      / /  \\ \\      .       .
      .          /_/____\\_\\          .
 .        .        \\  ||  /        .        .
       .       .     \\||/     .       .
  .        .       -- /\\ --       .        .
       .          .  /  \\  .          .
  .        .          .          .        .
       .       .  .       .  .       .
";
    }

    .orbit-two {
      width: min(64vw, 580px);
      height: min(64vw, 580px);
      color: rgba(255,255,255,.38);
      font-size: clamp(9px, 1vw, 13px);
      animation:
        asciiAppear 1.4s .7s ease-out forwards,
        orbitReverse 18s linear infinite;
    }

    .orbit-two::before {
      content:
"          .     /\\     .       .     /\\     .
     .        . /  \\ .       .        . /  \\ .
  .       ---   /\\   ---   .       ---   /\\   ---
       .       /  \\       .       .       /  \\
  .          _/____\\_          .          _/____\\_
       .        ||        .       .        ||
  .       .    //\\\\    .       .    //\\\\    .
";
    }

    .orbit-three {
      width: min(92vw, 850px);
      height: min(92vw, 850px);
      color: rgba(255,255,255,.23);
      font-size: clamp(8px, .8vw, 11px);
      animation:
        asciiAppear 1.8s .95s ease-out forwards,
        tentacleWave 8s ease-in-out infinite;
    }

    .orbit-three::before {
      content:
"   .  .  .      ~      .  .      ~      .  .  .
       ~     .       .       .       .     ~
  .       .       ~       .       ~       .       .
       .       .       .       .       .       .
  ~       .       .       ~       .       .       ~
       .       ~       .       .       ~       .
  .       .       .       .       .       .       .
";
    }

    @keyframes asciiAppear {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.65);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes orbitDrift {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) rotate(180deg) scale(1.04);
      }

      100% {
        transform: translate(-50%, -50%) rotate(360deg) scale(1);
      }
    }

    @keyframes orbitReverse {
      0% {
        transform: translate(-50%, -50%) rotate(360deg) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) rotate(180deg) scale(.96);
      }

      100% {
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }
    }

    @keyframes tentacleWave {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1) skewX(0deg);
      }

      25% {
        transform: translate(-50%, -50%) scale(1.025) skewX(1deg);
      }

      50% {
        transform: translate(-50%, -50%) scale(.98) skewX(-1deg);
      }

      75% {
        transform: translate(-50%, -50%) scale(1.02) skewX(.6deg);
      }
    }

    /* =========================================================
       APLICAÇÃO
    ========================================================= */

    .app-shell {
      min-height: 100vh;
      animation: appEnter .8s var(--ease) both;
    }

    @keyframes appEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      padding: 0 clamp(18px, 4vw, 68px);
      background: linear-gradient(#050505, transparent);
      transition: background .3s, backdrop-filter .3s;
    }

    .topbar.scrolled {
      background: rgba(5,5,5,.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .logo-button {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      background: transparent;
    }

    .mini-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-brand strong {
      font-size: 18px;
      letter-spacing: .2em;
    }

    .mini-brand img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter:
        grayscale(1)
        brightness(1.8)
        contrast(1.2);
      mix-blend-mode: screen;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links button {
      color: var(--muted);
      background: transparent;
      transition: color .2s, transform .2s;
    }

    .nav-links button:hover,
    .nav-links button.active {
      color: #fff;
      transform: translateY(-1px);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 36px;
      border: 1px solid transparent;
      border-radius: 999px;
      transition: .3s;
    }

    .search-wrap.open {
      padding: 0 12px;
      border-color: var(--line);
      background: rgba(255,255,255,.06);
    }

    .search-wrap input {
      width: 0;
      color: #fff;
      background: transparent;
      border: 0;
      outline: 0;
      transition: width .3s;
    }

    .search-wrap.open input {
      width: 150px;
    }

    .search-icon {
      color: #fff;
      background: transparent;
      font-size: 20px;
    }

    .avatar-button {
      width: 37px;
      height: 37px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%;
      background: #222;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: min(740px, 86vh);
      display: flex;
      align-items: flex-end;
      padding: 130px clamp(18px, 7vw, 110px) 75px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        linear-gradient(90deg, #050505 0%, rgba(5,5,5,.86) 22%, rgba(5,5,5,.3) 65%, #050505 100%),
        linear-gradient(0deg, #050505 0%, transparent 37%),
        var(--hero-image);
      background-position: center;
      background-size: cover;
      animation: heroZoom 13s ease-out both;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: radial-gradient(circle at 60% 30%, transparent, rgba(0,0,0,.44));
      pointer-events: none;
    }

    @keyframes heroZoom {
      from {
        transform: scale(1.08);
      }

      to {
        transform: scale(1);
      }
    }

    .hero-content {
      max-width: 610px;
      animation: heroText .9s .2s var(--ease) both;
    }

    @keyframes heroText {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 16px;
      color: #ddd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-bottom: 14px;
      font-size: clamp(38px, 6vw, 76px);
      line-height: .96;
      letter-spacing: -.055em;
    }

    .hero-description {
      max-width: 530px;
      margin-bottom: 25px;
      color: #d1d1d1;
      font-size: clamp(14px, 1.7vw, 18px);
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 45px;
      padding: 0 20px;
      border-radius: 9px;
      font-weight: 700;
      transition:
        transform .25s var(--ease),
        background .25s,
        opacity .25s;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .btn-primary {
      color: #050505;
      background: #fff;
    }

    .btn-secondary {
      color: #fff;
      background: rgba(255,255,255,.13);
      backdrop-filter: blur(12px);
    }

    .btn-ghost {
      color: #fff;
      background: transparent;
      border: 1px solid var(--line);
    }

    /* =========================================================
       CATÁLOGO
    ========================================================= */

    main {
      position: relative;
      z-index: 1;
      padding-bottom: 80px;
    }

    .content-section {
      margin: 0 auto 44px;
      padding: 0 clamp(18px, 4vw, 68px);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 17px;
    }

    .section-heading h2 {
      font-size: clamp(19px, 2.6vw, 27px);
      letter-spacing: -.03em;
    }

    .see-more {
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      transition: color .2s;
    }

    .see-more:hover {
      color: #fff;
    }

    .media-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: clamp(145px, 18vw, 220px);
      gap: 14px;
      overflow-x: auto;
      padding: 4px 3px 14px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .media-row::-webkit-scrollbar {
      display: none;
    }

    .media-card {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface-light);
      scroll-snap-align: start;
      isolation: isolate;
      transition:
        transform .35s var(--ease),
        box-shadow .35s;
    }

    .media-card:hover {
      z-index: 2;
      transform: translateY(-8px) scale(1.035);
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform .5s var(--ease),
        filter .4s;
    }

    .media-card:hover img {
      transform: scale(1.08);
      filter: brightness(.7);
    }

    .media-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 43%, rgba(0,0,0,.96));
      pointer-events: none;
    }

    .card-info {
      position: absolute;
      z-index: 2;
      right: 12px;
      bottom: 12px;
      left: 12px;
    }

    .card-title {
      overflow: hidden;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      color: #c0c0c0;
      font-size: 11px;
    }

    .progress-track {
      height: 3px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.3);
    }

    .progress-value {
      height: 100%;
      background: #fff;
    }

    .empty-state {
      width: 100%;
      padding: 30px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      text-align: center;
    }

    /* =========================================================
       MODAIS
    ========================================================= */

    .modal-backdrop {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: auto;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(14px);
      animation: fadeIn .25s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal {
      position: relative;
      width: min(950px, 100%);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #101010;
      box-shadow: 0 30px 100px rgba(0,0,0,.7);
      animation: modalIn .4s var(--ease) both;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-close {
      position: absolute;
      z-index: 3;
      top: 15px;
      right: 15px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      font-size: 20px;
    }

    .detail-banner {
      position: relative;
      min-height: 360px;
      display: flex;
      align-items: flex-end;
      padding: 35px;
      background-position: center;
      background-size: cover;
    }

    .detail-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 15%, #101010 96%);
    }

    .detail-content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .detail-content h2 {
      margin-bottom: 10px;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -.05em;
    }

    .detail-content p {
      color: #d0d0d0;
      line-height: 1.55;
    }

    .detail-body {
      padding: 0 35px 35px;
    }

    .season-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .season-button {
      padding: 9px 13px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
    }

    .season-button.active,
    .season-button:hover {
      color: #050505;
      background: #fff;
    }

    .episode-list {
      display: grid;
      gap: 8px;
    }

    .episode {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      transition:
        background .2s,
        border .2s;
    }

    .episode:hover {
      border-color: var(--line);
      background: rgba(255,255,255,.08);
    }

    .episode img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 8px;
    }

    .episode h3 {
      margin-bottom: 5px;
      font-size: 14px;
    }

    .episode p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    /* =========================================================
       LOGIN
    ========================================================= */

    .login-card {
      width: min(430px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #101010;
      box-shadow: 0 30px 100px rgba(0,0,0,.7);
      animation: modalIn .4s var(--ease) both;
    }

    .login-brand {
      display: grid;
      place-items: center;
      margin-bottom: 30px;
    }

    .login-leaf {
      width: 108px;
      height: 108px;
      object-fit: contain;
      mix-blend-mode: screen;
      filter:
        grayscale(1)
        brightness(1.9)
        contrast(1.3)
        drop-shadow(0 0 15px rgba(255,255,255,.2));
      animation: loginLeafFloat 4s ease-in-out infinite;
    }

    @keyframes loginLeafFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-7px) rotate(2deg);
      }
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .field input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: 0;
      background: #181818;
      transition:
        border .2s,
        box-shadow .2s;
    }

    .field input:focus {
      border-color: rgba(255,255,255,.6);
      box-shadow: 0 0 0 4px rgba(255,255,255,.07);
    }

    .login-error {
      min-height: 20px;
      margin: 3px 0 12px;
      color: #ff9999;
      font-size: 12px;
    }

    .login-card .btn {
      width: 100%;
    }

    /* =========================================================
       PERFIS
    ========================================================= */

    .profile-panel {
      width: min(680px, 100%);
      padding: 35px;
    }

    .profile-panel h2 {
      margin-bottom: 20px;
      font-size: 27px;
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
      gap: 18px;
    }

    .profile-option {
      display: grid;
      gap: 9px;
      justify-items: center;
      color: var(--muted);
      background: transparent;
      transition:
        color .25s,
        transform .25s;
    }

    .profile-option:hover {
      color: #fff;
      transform: translateY(-5px);
    }

    .profile-option img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 2px solid transparent;
      border-radius: 50%;
      transition: border .25s;
    }

    .profile-option:hover img {
      border-color: #fff;
    }

    /* =========================================================
       NOTIFICAÇÃO
    ========================================================= */

    .toast {
      position: fixed;
      z-index: 500;
      right: 20px;
      bottom: 20px;
      max-width: 330px;
      padding: 13px 16px;
      color: #050505;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
      animation: toastIn .35s var(--ease) both;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading {
      display: grid;
      place-items: center;
      min-height: 160px;
      color: var(--muted);
    }

    /* =========================================================
       RESPONSIVO
    ========================================================= */

    @media (max-width: 700px) {
      .topbar {
        height: 64px;
      }

      .nav-links {
        display: none;
      }

      .top-actions {
        gap: 5px;
      }

      .hero {
        min-height: 660px;
        padding-bottom: 42px;
      }

      .hero::before {
        background:
          linear-gradient(0deg, #050505 4%, rgba(5,5,5,.24) 70%, rgba(5,5,5,.42)),
          var(--hero-image);
        background-position: 62% center;
        background-size: cover;
      }

      .hero-content {
        max-width: 100%;
      }

      .hero-description {
        font-size: 14px;
      }

      .detail-banner {
        min-height: 300px;
        padding: 25px;
      }

      .detail-body {
        padding: 0 25px 25px;
      }

      .episode {
        grid-template-columns: 95px 1fr;
      }

      .episode .btn {
        grid-column: 2;
        width: max-content;
      }

      .login-card,
      .profile-panel {
        padding: 25px;
      }

      .ascii-orbit {
        font-size: 9px;
        letter-spacing: .08em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- INTRODUÇÃO: SOMENTE A FOLHA E O MOVIMENTO ASCII -->
  <div id="splash" class="splash">
    <div class="ascii-orbit orbit-one"></div>
    <div class="ascii-orbit orbit-two"></div>
    <div class="ascii-orbit orbit-three"></div>

    <div class="leaf-intro">
      <div class="leaf-glow"></div>

      <img
        class="intro-leaf"
        src="1000002482.jpg"
        alt="Símbolo do Lumim"
      />
    </div>
  </div>

  <!-- APLICAÇÃO -->
  <div id="app" class="app-shell hidden">
    <header id="topbar" class="topbar">
      <button
        class="logo-button"
        onclick="goHome()"
        aria-label="Ir para o início"
      >
        <span class="mini-brand">
          <img src="1000002482.jpg" alt="" />
          <strong>Lumim</strong>
        </span>
      </button>

      <nav class="nav-links">
        <button
          class="active"
          data-route="inicio"
          onclick="goHome()"
        >
          Início
        </button>

        <button
          data-route="filmes"
          onclick="openCatalog('Filmes')"
        >
          Filmes
        </button>

        <button
          data-route="series"
          onclick="openCatalog('Séries')"
        >
          Séries
        </button>

        <button
          data-route="minha-lista"
          onclick="showMyList()"
        >
          Minha lista
        </button>
      </nav>

      <div class="top-actions">
        <div id="searchWrap" class="search-wrap">
          <button
            class="search-icon"
            onclick="toggleSearch()"
            aria-label="Pesquisar"
          >
            ⌕
          </button>

          <input
            id="searchInput"
            type="search"
            placeholder="Pesquisar"
            oninput="searchTitles(this.value)"
          />
        </div>

        <button
          class="avatar-button"
          onclick="openProfiles()"
          aria-label="Trocar perfil"
        >
          <img id="headerAvatar" alt="Perfil atual" />
        </button>
      </div>
    </header>

    <section id="hero" class="hero">
      <div class="hero-content">
        <div class="eyebrow">Destaque Lumim</div>

        <h1 id="heroTitle">
          Descubra algo extraordinário.
        </h1>

        <p id="heroDescription" class="hero-description">
          Uma experiência de entretenimento pensada para você.
        </p>

        <div class="hero-actions">
          <button
            id="heroPlay"
            class="btn btn-primary"
          >
            ▶ Assistir
          </button>

          <button
            id="heroInfo"
            class="btn btn-secondary"
          >
            ⓘ Mais informações
          </button>
        </div>
      </div>
    </section>

    <main id="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
    /*
      ==========================================================
      CONFIGURAÇÃO REAL DO SUPABASE
    ==========================================================
    */

    const SUPABASE_URL =
      "https://hrgyquogyymyqpmjooqs.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WTPoG_P7uV29tOH2zTYh1w_rdNowBlB";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const fallbackImages = [
      "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?auto=format&fit=crop&w=900&q=80"
    ];

    const state = {
      user: null,
      profile: null,
      profiles: [],
      categories: [],
      titles: [],
      heroTitle: null,
      progress: {},
      activeTitle: null
    };

    document.addEventListener("DOMContentLoaded", async () => {
      setTimeout(() => {
        document.getElementById("splash").classList.add("hide");
        document.getElementById("app").classList.remove("hidden");
      }, 1700);

      window.addEventListener("scroll", () => {
        document
          .getElementById("topbar")
          .classList.toggle(
            "scrolled",
            window.scrollY > 30
          );
      });

      const { data, error } = await db.auth.getSession();

      if (error) {
        console.error("Erro ao recuperar sessão:", error);
        showLogin();
        return;
      }

      if (data.session?.user) {
        state.user = data.session.user;
        await initializeApp();
      } else {
        showLogin();
      }

      db.auth.onAuthStateChange(async (_event, session) => {
        if (session?.user) {
          state.user = session.user;
          await initializeApp();
        } else {
          state.user = null;
          showLogin();
        }
      });
    });

    async function initializeApp() {
      closeModal();

      await Promise.all([
        loadProfiles(),
        loadCategories(),
        loadTitles(),
        loadProgress()
      ]);

      setCurrentProfile();
      renderHeader();
      renderHero();
      renderHome();
    }

    function showLogin() {
      document.getElementById("app").classList.remove("hidden");

      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop">
          <form
            class="login-card"
            onsubmit="handleLogin(event)"
          >
            <div class="login-brand">
              <img
                class="login-leaf"
                src="1000002482.jpg"
                alt="Símbolo do Lumim"
              />
            </div>

            <div class="field">
              <label for="loginEmail">E-mail</label>

              <input
                id="loginEmail"
                type="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="field">
              <label for="loginPassword">Senha</label>

              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>

            <div
              id="loginError"
              class="login-error"
            ></div>

            <button
              class="btn btn-primary"
              type="submit"
            >
              Entrar
            </button>
          </form>
        </div>
      `;

      document.body.classList.add("modal-open");
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = document
        .getElementById("loginEmail")
        .value
        .trim();

      const password = document
        .getElementById("loginPassword")
        .value;

      const { error } =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showLoginError(
          "Não foi possível entrar. Verifique seus dados."
        );
      }
    }

    function showLoginError(message) {
      const element =
        document.getElementById("loginError");

      if (element) {
        element.textContent = message;
      }
    }

    async function loadProfiles() {
      const { data, error } = await db
        .from("profiles")
        .select("*")
        .order("created_at", {
          ascending: true
        });

      if (error) {
        console.error("Erro nos perfis:", error);
        state.profiles = [];
        return;
      }

      state.profiles = data || [];
    }

    async function loadCategories() {
      const { data, error } = await db
        .from("categories")
        .select("*")
        .order("position", {
          ascending: true
        });

      if (error) {
        console.error("Erro nas categorias:", error);
        state.categories = [];
        return;
      }

      state.categories = data || [];
    }

    async function loadTitles() {
      const { data, error } = await db
        .from("titles")
        .select(`
          *,
          category_titles (
            category_id,
            categories (*)
          )
        `)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error("Erro nos títulos:", error);
        state.titles = [];
        return;
      }

      state.titles = data || [];
    }

    async function loadProgress() {
      if (!state.user) return;

      const { data, error } = await db
        .from("watch_progress")
        .select("*")
        .eq("user_id", state.user.id);

      if (error) {
        console.error("Erro no progresso:", error);
        state.progress = {};
        return;
      }

      state.progress = {};

      (data || []).forEach(row => {
        state.progress[row.title_id] = row;
      });
    }

    function setCurrentProfile() {
      const profileId =
        localStorage.getItem("lumim_profile_id");

      state.profile =
        state.profiles.find(profile => {
          return String(profile.id) === String(profileId);
        }) ||
        state.profiles[0] ||
        null;
    }

    function renderHeader() {
      const avatar =
        state.profile?.avatar_url ||
        "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80";

      document.getElementById("headerAvatar").src =
        avatar;
    }

    function renderHero() {
      const title =
        state.heroTitle ||
        state.titles.find(item => item.featured) ||
        state.titles[0];

      if (!title) {
        document
          .getElementById("hero")
          .style
          .setProperty(
            "--hero-image",
            `url("${fallbackImages[0]}")`
          );

        return;
      }

      state.heroTitle = title;

      document.getElementById("heroTitle").textContent =
        title.name ||
        title.title ||
        "Descubra algo extraordinário.";

      document.getElementById("heroDescription").textContent =
        title.description ||
        "Uma nova experiência espera por você.";

      document
        .getElementById("hero")
        .style
        .setProperty(
          "--hero-image",
          `url("${title.backdrop_url || title.poster_url || fallbackImages[0]}")`
        );

      document.getElementById("heroPlay").onclick =
        () => playTitle(title);

      document.getElementById("heroInfo").onclick =
        () => openTitle(title);
    }

    function renderHome() {
      const content = document.getElementById("content");
      content.innerHTML = "";

      const continueTitles = state.titles.filter(title => {
        return state.progress[title.id]?.position > 0;
      });

      if (continueTitles.length) {
        content.appendChild(
          createSection(
            "Continuar assistindo",
            continueTitles,
            true
          )
        );
      }

      const categories = state.categories.length
        ? state.categories
        : createFallbackCategories();

      categories.forEach(category => {
        const titles = state.titles.filter(title => {
          return titleMatchesCategory(title, category);
        });

        if (titles.length) {
          content.appendChild(
            createSection(category.name, titles)
          );
        }
      });

      if (!content.children.length) {
        content.innerHTML = `
          <section class="content-section">
            <div class="empty-state">
              Nenhum conteúdo disponível no momento.
            </div>
          </section>
        `;
      }
    }

    function createFallbackCategories() {
      return [
        {
          id: "all-filmes",
          name: "Filmes",
          type: "filme"
        },
        {
          id: "all-series",
          name: "Séries",
          type: "série"
        }
      ];
    }

    function titleMatchesCategory(title, category) {
      const linked = (title.category_titles || []).some(link => {
        return String(link.category_id) === String(category.id);
      });

      if (linked) return true;

      const titleType = String(title.type || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");

      const categoryType = String(category.type || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");

      const categoryName = String(category.name || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");

      return (
        titleType.includes(categoryType) ||
        titleType.includes(categoryName)
      );
    }

    function createSection(
      name,
      titles,
      showProgress = false
    ) {
      const section =
        document.createElement("section");

      section.className = "content-section";

      section.innerHTML = `
        <div class="section-heading">
          <h2>${escapeHtml(name)}</h2>

          <button class="see-more">
            Ver mais
          </button>
        </div>

        <div class="media-row"></div>
      `;

      section
        .querySelector(".see-more")
        .onclick = () => openCatalog(name, titles);

      const row =
        section.querySelector(".media-row");

      titles.slice(0, 12).forEach(title => {
        row.appendChild(
          createCard(title, showProgress)
        );
      });

      return section;
    }

    function createCard(title, showProgress = false) {
      const card =
        document.createElement("article");

      card.className = "media-card";
      card.tabIndex = 0;

      const image =
        title.poster_url ||
        fallbackImages[
          Math.abs(
            hashCode(title.id || title.name)
          ) % fallbackImages.length
        ];

      const progress = state.progress[title.id];

      const percentage =
        progress &&
        title.duration &&
        progress.position
          ? Math.min(
              100,
              (progress.position / title.duration) * 100
            )
          : 0;

      card.innerHTML = `
        <img
          src="${escapeAttribute(image)}"
          alt="${escapeAttribute(
            title.name ||
            title.title ||
            "Título"
          )}"
          loading="lazy"
        />

        <div class="card-info">
          <div class="card-title">
            ${escapeHtml(
              title.name ||
              title.title ||
              "Sem título"
            )}
          </div>

          <div class="card-meta">
            <span>
              ${escapeHtml(title.year || "")}
            </span>

            <span>
              ${escapeHtml(title.type || "Conteúdo")}
            </span>
          </div>

          ${
            showProgress && percentage
              ? `
                <div class="progress-track">
                  <div
                    class="progress-value"
                    style="width:${percentage}%"
                  ></div>
                </div>
              `
              : ""
          }
        </div>
      `;

      card.onclick = () => openTitle(title);

      card.onkeydown = event => {
        if (event.key === "Enter") {
          openTitle(title);
        }
      };

      return card;
    }

    function openCatalog(
      categoryName,
      suppliedTitles = null
    ) {
      const titles =
        suppliedTitles ||
        state.titles.filter(title => {
          const type = String(title.type || "")
            .toLowerCase();

          const category = String(
            title.category || ""
          ).toLowerCase();

          const target = String(categoryName || "")
            .toLowerCase();

          return (
            type.includes(target) ||
            category.includes(target)
          );
        });

      const modal = createModal(`
        <div
          class="detail-body"
          style="padding-top:35px"
        >
          <h2 style="margin-bottom:20px">
            ${escapeHtml(categoryName)}
          </h2>

          <div
            class="media-row"
            style="
              grid-template-columns:
                repeat(auto-fill,minmax(145px,1fr));
              grid-auto-flow:row;
              overflow:visible;
            "
          ></div>
        </div>
      `);

      const row =
        modal.querySelector(".media-row");

      if (!titles.length) {
        row.innerHTML = `
          <div class="empty-state">
            Nenhum título encontrado.
          </div>
        `;
      } else {
        titles.forEach(title => {
          row.appendChild(createCard(title));
        });
      }
    }

    function openTitle(title) {
      state.activeTitle = title;

      const normalizedType = String(title.type || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");

      const isSeries =
        normalizedType.includes("serie") ||
        title.is_series === true;

      const image =
        title.backdrop_url ||
        title.poster_url ||
        fallbackImages[0];

      const modal = createModal(`
        <div
          class="detail-banner"
          style="
            background-image:
              url('${escapeAttribute(image)}')
          "
        >
          <div class="detail-content">
            <div class="eyebrow">
              ${escapeHtml(title.type || "Título")}
              ·
              ${escapeHtml(title.year || "")}
            </div>

            <h2>
              ${escapeHtml(
                title.name ||
                title.title ||
                "Sem título"
              )}
            </h2>

            <p>
              ${escapeHtml(
                title.description ||
                "Prepare-se para assistir."
              )}
            </p>

            <div style="margin-top:20px">
              <button
                class="btn btn-primary"
                onclick="playTitle(state.activeTitle)"
              >
                ▶ Assistir
              </button>
            </div>
          </div>
        </div>

        <div class="detail-body">
          ${
            isSeries
              ? `
                <div
                  class="season-bar"
                  id="seasonBar"
                >
                  <button
                    class="season-button active"
                  >
                    Temporada 1
                  </button>
                </div>

                <div
                  id="episodeList"
                  class="episode-list"
                >
                  <div class="loading">
                    Carregando episódios...
                  </div>
                </div>
              `
              : ""
          }
        </div>
      `);

      if (isSeries) {
        loadEpisodes(title, modal);
      }
    }

    async function loadEpisodes(title, modal) {
      const list =
        modal.querySelector("#episodeList");

      if (!list) return;

      const { data, error } = await db
        .from("episodes")
        .select("*")
        .eq("title_id", title.id)
        .order("season", {
          ascending: true
        })
        .order("episode_number", {
          ascending: true
        });

      if (error || !data?.length) {
        list.innerHTML = `
          <div class="empty-state">
            Nenhum episódio disponível.
          </div>
        `;

        return;
      }

      const seasons = [
        ...new Set(
          data.map(episode => episode.season || 1)
        )
      ];

      const seasonBar =
        modal.querySelector("#seasonBar");

      seasonBar.innerHTML = seasons
        .map(season => {
          return `
            <button
              class="season-button ${
                season === seasons[0]
                  ? "active"
                  : ""
              }"
              data-season="${season}"
            >
              Temporada ${season}
            </button>
          `;
        })
        .join("");

      seasonBar
        .querySelectorAll(".season-button")
        .forEach(button => {
          button.onclick = () => {
            seasonBar
              .querySelectorAll(".season-button")
              .forEach(item => {
                item.classList.remove("active");
              });

            button.classList.add("active");

            renderEpisodes(
              data,
              Number(button.dataset.season),
              list
            );
          };
        });

      renderEpisodes(data, seasons[0], list);
    }

    function renderEpisodes(
      episodes,
      season,
      list
    ) {
      const selected = episodes.filter(episode => {
        return Number(episode.season || 1) ===
          Number(season);
      });

      list.innerHTML = selected
        .map(episode => {
          return `
            <article class="episode">
              <img
                src="${escapeAttribute(
                  episode.thumbnail_url ||
                  fallbackImages[2]
                )}"
                alt=""
                loading="lazy"
              />

              <div>
                <h3>
                  ${escapeHtml(
                    episode.episode_number || ""
                  )}.
                  ${escapeHtml(
                    episode.name ||
                    episode.title ||
                    "Episódio"
                  )}
                </h3>

                <p>
                  ${escapeHtml(
                    episode.description || ""
                  )}
                </p>
              </div>

              <button
                class="btn btn-ghost"
                onclick='playEpisode(${safeJson(episode)})'
              >
                Assistir
              </button>
            </article>
          `;
        })
        .join("");
    }

    function playEpisode(episode) {
      if (episode.video_url) {
        window.open(
          episode.video_url,
          "_blank",
          "noopener,noreferrer"
        );
      } else {
        showToast("Este episódio foi selecionado.");
      }
    }

    function playTitle(title) {
      if (!title) return;

      if (title.video_url) {
        window.open(
          title.video_url,
          "_blank",
          "noopener,noreferrer"
        );
      } else {
        showToast("Este conteúdo foi selecionado.");
      }
    }

    function openProfiles() {
      const profiles = state.profiles.length
        ? state.profiles
        : [
            {
              id: "default",
              name:
                state.user?.email?.split("@")[0] ||
                "Perfil",
              avatar_url:
                "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80"
            }
          ];

      const modal = createModal(`
        <div class="profile-panel">
          <h2>Quem está assistindo?</h2>

          <div class="profiles-grid">
            ${profiles
              .map(profile => {
                return `
                  <button
                    class="profile-option"
                    data-profile="${escapeAttribute(
                      profile.id
                    )}"
                  >
                    <img
                      src="${escapeAttribute(
                        profile.avatar_url
                      )}"
                      alt="${escapeAttribute(
                        profile.name
                      )}"
                    />

                    <span>
                      ${escapeHtml(profile.name)}
                    </span>
                  </button>
                `;
              })
              .join("")}
          </div>
        </div>
      `);

      modal
        .querySelectorAll(".profile-option")
        .forEach(button => {
          button.onclick = () => {
            localStorage.setItem(
              "lumim_profile_id",
              button.dataset.profile
            );

            setCurrentProfile();
            renderHeader();
            closeModal();

            showToast(
              `Perfil ${
                state.profile?.name || ""
              } selecionado.`
            );
          };
        });
    }

    function showMyList() {
      const list = state.titles.filter(title => {
        return title.is_favorite === true;
      });

      openCatalog("Minha lista", list);
    }

    function toggleSearch() {
      const wrap =
        document.getElementById("searchWrap");

      wrap.classList.toggle("open");

      if (wrap.classList.contains("open")) {
        document
          .getElementById("searchInput")
          .focus();
      }
    }

    function searchTitles(query) {
      const value = query.trim().toLowerCase();

      if (!value) {
        renderHome();
        return;
      }

      const results = state.titles.filter(title => {
        return (
          String(
            title.name ||
            title.title ||
            ""
          )
            .toLowerCase()
            .includes(value) ||
          String(title.description || "")
            .toLowerCase()
            .includes(value)
        );
      });

      const content =
        document.getElementById("content");

      content.innerHTML = "";

      content.appendChild(
        createSection(
          `Resultados para “${query}”`,
          results
        )
      );
    }

    function goHome() {
      document
        .querySelectorAll(".nav-links button")
        .forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.route === "inicio"
          );
        });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      renderHome();
    }

    function createModal(content) {
      const root =
        document.getElementById("modalRoot");

      root.innerHTML = `
        <div
          class="modal-backdrop"
          onclick="backdropClose(event)"
        >
          <section
            class="modal"
            onclick="event.stopPropagation()"
          >
            <button
              class="modal-close"
              onclick="closeModal()"
              aria-label="Fechar"
            >
              ×
            </button>

            ${content}
          </section>
        </div>
      `;

      document.body.classList.add("modal-open");

      return root.querySelector(".modal");
    }

    function backdropClose(event) {
      if (
        event.target.classList.contains(
          "modal-backdrop"
        )
      ) {
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
      document.body.classList.remove("modal-open");
    }

    function showToast(message) {
      const root =
        document.getElementById("toastRoot");

      root.innerHTML = `
        <div class="toast">
          ${escapeHtml(message)}
        </div>
      `;

      setTimeout(() => {
        root.innerHTML = "";
      }, 2800);
    }

    async function saveProgress(
      titleId,
      position,
      duration = null,
      episodeId = null
    ) {
      if (!state.user) return;

      const payload = {
        user_id: state.user.id,
        title_id: titleId,
        episode_id: episodeId,
        position,
        duration,
        updated_at: new Date().toISOString()
      };

      const { error } = await db
        .from("watch_progress")
        .upsert(payload, {
          onConflict:
            "user_id,title_id,episode_id"
        });

      if (error) {
        console.error(
          "Erro ao salvar progresso:",
          error
        );
      }
    }

    function hashCode(value) {
      return String(value)
        .split("")
        .reduce((hash, char) => {
          return (
            ((hash << 5) - hash) +
            char.charCodeAt(0)
          ) | 0;
        }, 0);
    }

    function safeJson(value) {
      return JSON.stringify(value)
        .replaceAll("&", "\\u0026")
        .replaceAll("<", "\\u003c")
        .replaceAll(">", "\\u003e")
        .replaceAll("'", "\\u0027");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
