# Lumim — gera o APK (celular + Android TV) e publica numa Release do GitHub.
# Coloque este arquivo em:  .github/workflows/build-apk.yml
# Roda sozinho a cada push em main/master, ou manualmente em Actions > Build APK > Run workflow.

name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar o site (www)
        run: |
          mkdir -p build/www
          cp index.html build/www/
          for f in *.jpg *.jpeg *.png *.webp *.svg *.ico *.gif; do
            if [ -f "$f" ]; then cp "$f" build/www/; fi
          done
          sed -i "s/__APP_VERSION__/${BUILD}/; s|__GH_REPO__|${GITHUB_REPOSITORY}|" build/www/index.html
          grep -o 'name="app-version" content="[^"]*"' build/www/index.html
          grep -o 'name="github-repo" content="[^"]*"' build/www/index.html

      - name: Criar projeto Capacitor + Android
        working-directory: build
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lumim.watch",
            "appName": "Lumim",
            "webDir": "www",
            "backgroundColor": "#050505",
            "android": { "allowMixedContent": true },
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          pip install --quiet pillow

      - name: Aplicar TV, instalador de atualização e assinatura
        working-directory: build
        run: |
          echo "" | base64 -d > lumim.keystore
          JAVA_DIR=android/app/src/main/java/com/lumim/watch
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/ApkInstallerPlugin.java" <<'EOF'
          package com.lumim.watch;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {

              private final Handler handler = new Handler(Looper.getMainLooper());
              private Runnable poller;
              private long downloadId = -1;

              @PluginMethod
              public void install(PluginCall call) {
                  String url = call.getString("url");
                  String fileName = call.getString("fileName", "Lumim-update.apk");

                  if (url == null || url.isEmpty()) {
                      call.reject("URL ausente");
                      return;
                  }

                  Context context = getContext();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !context.getPackageManager().canRequestPackageInstalls()) {
                      try {
                          Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + context.getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(intent);
                      } catch (Exception ignored) {
                      }
                      call.reject("Permita instalar apps desta origem", "NEEDS_PERMISSION");
                      return;
                  }

                  try {
                      stopPolling();

                      File dir = context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      if (dir != null) {
                          File old = new File(dir, fileName);
                          if (old.exists()) {
                              old.delete();
                          }
                      }

                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("Atualização do Lumim");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
                      request.setDestinationInExternalFilesDir(
                              context, Environment.DIRECTORY_DOWNLOADS, fileName);

                      DownloadManager manager =
                              (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
                      downloadId = manager.enqueue(request);

                      startPolling(fileName);

                      JSObject result = new JSObject();
                      result.put("started", true);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Falha ao iniciar o download: " + e.getMessage());
                  }
              }

              private void startPolling(final String fileName) {
                  poller = new Runnable() {
                      @Override
                      public void run() {
                          DownloadManager manager =
                                  (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                          Cursor cursor = null;

                          try {
                              cursor = manager.query(new DownloadManager.Query().setFilterById(downloadId));

                              if (cursor != null && cursor.moveToFirst()) {
                                  int status = cursor.getInt(
                                          cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                                  long done = cursor.getLong(cursor.getColumnIndexOrThrow(
                                          DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                                  long total = cursor.getLong(cursor.getColumnIndexOrThrow(
                                          DownloadManager.COLUMN_TOTAL_SIZE_BYTES));

                                  if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                      stopPolling();
                                      notifyListeners("downloadDone", new JSObject());
                                      installApk(fileName);
                                      return;
                                  }

                                  if (status == DownloadManager.STATUS_FAILED) {
                                      stopPolling();
                                      notifyListeners("downloadError", new JSObject());
                                      return;
                                  }

                                  JSObject progress = new JSObject();
                                  progress.put("percent", total > 0 ? (int) (done * 100 / total) : 0);
                                  notifyListeners("downloadProgress", progress);
                              } else {
                                  stopPolling();
                                  notifyListeners("downloadError", new JSObject());
                                  return;
                              }
                          } catch (Exception e) {
                              stopPolling();
                              notifyListeners("downloadError", new JSObject());
                              return;
                          } finally {
                              if (cursor != null) {
                                  cursor.close();
                              }
                          }

                          handler.postDelayed(this, 500);
                      }
                  };

                  handler.post(poller);
              }

              private void stopPolling() {
                  if (poller != null) {
                      handler.removeCallbacks(poller);
                      poller = null;
                  }
              }

              private void installApk(String fileName) {
                  try {
                      Context context = getContext();
                      File file = new File(
                              context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), fileName);

                      Uri uri = FileProvider.getUriForFile(
                              context, context.getPackageName() + ".fileprovider", file);

                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, "application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                  } catch (Exception e) {
                      notifyListeners("downloadError", new JSObject());
                  }
              }

              @Override
              protected void handleOnDestroy() {
                  stopPolling();
              }
          }
          EOF
          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package com.lumim.watch;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstallerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > patch_android.py <<'PY'
          import os, re, pathlib

          build = os.environ["BUILD"]
          main = pathlib.Path("android/app/src/main")

          # ---------- AndroidManifest ----------
          manifest = main / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          text = text.replace(
              "<application",
              '<application android:usesCleartextTraffic="true" android:banner="@drawable/tv_banner"',
              1,
          )

          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
                  '    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n\n'
                  "    <application",
                  1,
              )

          text = re.sub(
              r'(<category android:name="android.intent.category.LAUNCHER"\s*/>)',
              r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
              text,
              count=1,
          )

          if "FileProvider" not in text:
              text = text.replace(
                  "</application>",
                  '    <provider android:name="androidx.core.content.FileProvider" '
                  'android:authorities="${applicationId}.fileprovider" '
                  'android:exported="false" android:grantUriPermissions="true">\n'
                  '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" '
                  'android:resource="@xml/file_paths" />\n'
                  "        </provider>\n    </application>",
                  1,
              )

          assert "LEANBACK_LAUNCHER" in text, "Falha ao adicionar LEANBACK_LAUNCHER"
          manifest.write_text(text, encoding="utf-8")

          # ---------- FileProvider paths ----------
          xml_dir = main / "res" / "xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "file_paths.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<paths xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <external-files-path name="downloads" path="." />\n'
              '    <external-path name="external" path="." />\n'
              '    <cache-path name="cache" path="." />\n'
              "</paths>\n",
              encoding="utf-8",
          )

          # ---------- Gradle: versão + assinatura fixa ----------
          gradle = pathlib.Path("android/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")

          g = re.sub(r"versionCode\s+\d+", f"versionCode {build}", g, count=1)
          g = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{build}"', g, count=1)

          signing = (
              "    signingConfigs {\n"
              "        release {\n"
              '            storeFile file(System.getenv("KEYSTORE_PATH"))\n'
              '            storePassword "lumim-release-2026"\n'
              '            keyAlias "lumim"\n'
              '            keyPassword "lumim-release-2026"\n'
              "        }\n"
              "    }\n"
          )

          g = g.replace("buildTypes {", signing + "    buildTypes {", 1)
          g = re.sub(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              g,
              count=1,
          )

          assert "signingConfig signingConfigs.release" in g, "Falha ao configurar a assinatura"
          assert f"versionCode {build}" in g, "Falha ao definir versionCode"
          gradle.write_text(g, encoding="utf-8")

          # ---------- Ícone, banner de TV ----------
          from PIL import Image, ImageDraw, ImageOps

          logo_path = pathlib.Path("www/1000002482.jpg")


          def base_logo(size):
              if logo_path.exists():
                  return ImageOps.fit(Image.open(logo_path).convert("RGB"), (size, size))

              image = Image.new("RGB", (size, size), (0, 0, 0))
              draw = ImageDraw.Draw(image)
              pad = size * 0.28
              draw.ellipse([pad, pad, size - pad, size - pad], outline=(255, 255, 255), width=max(2, size // 24))
              return image


          res = main / "res"
          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          for name, px in densities.items():
              folder = res / f"mipmap-{name}"
              folder.mkdir(parents=True, exist_ok=True)

              square = base_logo(px)
              square.save(folder / "ic_launcher.png")

              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, px - 1, px - 1], fill=255)
              round_icon = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_icon.paste(square.convert("RGBA"), (0, 0), mask)
              round_icon.save(folder / "ic_launcher_round.png")

              fg = int(px * 108 / 48)
              canvas = Image.new("RGBA", (fg, fg), (0, 0, 0, 0))
              inner = int(fg * 0.6)
              canvas.paste(base_logo(inner).convert("RGBA"), ((fg - inner) // 2, (fg - inner) // 2))
              canvas.save(folder / "ic_launcher_foreground.png")

          background = res / "values" / "ic_launcher_background.xml"

          if background.exists():
              background.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                  '    <color name="ic_launcher_background">#000000</color>\n</resources>\n',
                  encoding="utf-8",
              )

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          banner = Image.new("RGB", (640, 360), (5, 5, 5))
          banner.paste(base_logo(220), (210, 70))
          banner.save(drawable / "tv_banner.png")

          # Tela de abertura (substitui o splash padrão do Capacitor)
          for splash in res.glob("drawable*/splash.png"):
              width, height = Image.open(splash).size
              image = Image.new("RGB", (width, height), (0, 0, 0))
              side = int(min(width, height) * 0.32)
              image.paste(base_logo(side), ((width - side) // 2, (height - side) // 2))
              image.save(splash)

          print("Patch Android aplicado, versão 1.0." + build)
          PY
          python patch_android.py

      - name: Compilar APK
        working-directory: build/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/build/lumim.keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Separar APK
        run: cp build/android/app/build/outputs/apk/release/app-release.apk Lumim.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumim v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Build manual' }}
          files: Lumim.apk
          make_latest: true

      - name: Limpar releases antigas (mantém as 5 últimas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("build-"))] | .[5:][] | .tagName' | while read -r tag; do
            gh release delete "$tag" --cleanup-tag -y || true
          done
